[build-system]
requires = ["setuptools", "cython", "numpy"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rust_zscore"
version = "0.1.0"
description = "Python bindings for rust_zscore, generated by rust2cython."
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.so", "*.dylib", "*.h", "*.pxd"]

[tool.rust2cython]
generated_by = "rust2cython"
